<radialGradient id="fwinkOrb" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#E8FBFF"></stop><stop offset=".35" stop-color="#7FD9FF"></stop><stop offset="1" stop-color="#1C82D4"></stop></radialGradient>
