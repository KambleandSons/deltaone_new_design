<svg class="d1bolt face-wink" viewBox="-12 -14 194 206" xmlns="http://www.w3.org/2000/svg" width="194" height="206">
<style>.d1bolt .fx{display:none}
.d1bolt.face-happy .e-happy,.d1bolt.face-happy .m-smile,.d1bolt.face-happy .cheek,.d1bolt.face-happy .a-wave{display:inline}
.d1bolt.face-talk .e-happy,.d1bolt.face-talk .m-talk,.d1bolt.face-talk .cheek,.d1bolt.face-talk .a-wave{display:inline}
.d1bolt.face-cheer .e-cheer,.d1bolt.face-cheer .m-grin,.d1bolt.face-cheer .cheek,.d1bolt.face-cheer .a-up,.d1bolt.face-cheer .spark{display:inline}
.d1bolt.face-surprise .e-surprise,.d1bolt.face-surprise .m-o,.d1bolt.face-surprise .a-up{display:inline}
.d1bolt.face-think .e-think,.d1bolt.face-think .m-dots,.d1bolt.face-think .a-chin{display:inline}
.d1bolt.face-sad .e-sad,.d1bolt.face-sad .m-frown,.d1bolt.face-sad .a-down{display:inline}
.d1bolt.face-wink .e-wink,.d1bolt.face-wink .m-smile,.d1bolt.face-wink .cheek,.d1bolt.face-wink .a-wave{display:inline}
.d1bolt.face-love .e-love,.d1bolt.face-love .m-grin,.d1bolt.face-love .cheek,.d1bolt.face-love .a-up,.d1bolt.face-love .spark{display:inline}
.d1bolt .whole{transform-box:view-box;transform-origin:85px 180px;animation:bBreathe 3.4s ease-in-out infinite}
.d1bolt.face-cheer .whole,.d1bolt.face-love .whole{animation:bHop .3s ease-in-out 6 alternate,bBreathe 3.4s ease-in-out 1.8s infinite}
.d1bolt.face-surprise .whole{animation:bJolt .5s cubic-bezier(.2,1.8,.4,1) 1}
.d1bolt.face-talk .whole{animation:bNod .45s ease-in-out infinite alternate}
.d1bolt.face-think .whole{animation:bTilt 2.2s ease-in-out infinite}
.d1bolt.face-sad .whole{animation:bSag 3.6s ease-in-out infinite}
.d1bolt.face-wink .whole{animation:bWinkTilt .7s ease-out 1}
@keyframes bBreathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.012,.988)}}
@keyframes bHop{0%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(-14px) scale(.97,1.04)}}
@keyframes bJolt{0%{transform:scale(1)}30%{transform:translateY(-9px) scale(.94,1.08)}100%{transform:scale(1)}}
@keyframes bNod{0%{transform:rotate(-1.6deg)}100%{transform:rotate(1.6deg) translateY(-2px)}}
@keyframes bTilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(-2deg)}}
@keyframes bSag{0%,100%{transform:translateY(3px) rotate(-2deg)}50%{transform:translateY(5px) rotate(1.5deg)}}
@keyframes bWinkTilt{0%{transform:rotate(0)}40%{transform:rotate(-7deg)}100%{transform:rotate(0)}}
.d1bolt .ant{transform-box:view-box;transform-origin:88px 40px;animation:bSway 2.8s ease-in-out infinite}
.d1bolt.face-cheer .ant,.d1bolt.face-love .ant{animation-duration:.6s}
.d1bolt.face-surprise .ant{animation:bBoing .6s cubic-bezier(.2,1.8,.4,1) 1}
.d1bolt.face-sad .ant{animation:none;transform:rotate(-22deg)}
@keyframes bSway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes bBoing{0%{transform:rotate(0)}25%{transform:rotate(-18deg)}55%{transform:rotate(12deg)}80%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
.d1bolt .oglow{animation:bGlow 2s ease-in-out infinite}
.d1bolt.face-talk .oglow,.d1bolt.face-think .oglow{animation-duration:.45s}
@keyframes bGlow{0%,100%{opacity:.15}50%{opacity:.6}}
.d1bolt .bl1{transform-box:view-box;transform-origin:85px 76px;animation:bBlink 4.6s infinite}
.d1bolt .bl2{transform-box:view-box;transform-origin:85px 76px;animation:bBlink2 6.7s infinite}
.d1bolt.face-surprise .bl1,.d1bolt.face-surprise .bl2,.d1bolt.face-love .bl1,.d1bolt.face-love .bl2{animation:none}
@keyframes bBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes bBlink2{0%,96%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.08)}}
.d1bolt .m-talk{transform-box:fill-box;transform-origin:center;animation:bMouth .17s ease-in-out infinite alternate}
@keyframes bMouth{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.d1bolt .a-wave.arm-l{transform-box:view-box;transform-origin:34px 98px;animation:bWave .9s ease-in-out infinite alternate}
.d1bolt.face-talk .a-wave.arm-l{animation-duration:1.6s}
.d1bolt .a-wave.arm-r{transform-box:view-box;transform-origin:140px 114px;animation:bRest 3s ease-in-out infinite alternate}
.d1bolt .a-up.arm-l{transform-box:view-box;transform-origin:34px 94px;animation:bPumpL .3s ease-in-out infinite alternate}
.d1bolt .a-up.arm-r{transform-box:view-box;transform-origin:136px 94px;animation:bPumpR .3s ease-in-out infinite alternate}
.d1bolt .a-down{transform-box:view-box;transform-origin:85px 108px;animation:bDangle 3.6s ease-in-out infinite alternate}
.d1bolt .a-chin.arm-r{transform-box:view-box;transform-origin:139px 116px;animation:bTap .5s ease-in-out infinite alternate}
@keyframes bWave{0%{transform:rotate(-16deg)}100%{transform:rotate(12deg)}}
@keyframes bRest{0%{transform:rotate(0)}100%{transform:rotate(8deg)}}
@keyframes bPumpL{0%{transform:rotate(-8deg)}100%{transform:rotate(7deg)}}
@keyframes bPumpR{0%{transform:rotate(8deg)}100%{transform:rotate(-7deg)}}
@keyframes bDangle{0%{transform:rotate(-2deg)}100%{transform:rotate(2deg)}}
@keyframes bTap{0%{transform:rotate(0)}100%{transform:rotate(-5deg)}}
.d1bolt .spark{transform-box:fill-box;transform-origin:center;animation:bTwinkle 1s ease-in-out infinite}
.d1bolt .sp2{animation-delay:.25s}.d1bolt .sp3{animation-delay:.5s}.d1bolt .sp4{animation-delay:.75s}
@keyframes bTwinkle{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
.d1bolt .td{animation:bDot 1s ease-in-out infinite}
.d1bolt .td2{animation-delay:.18s}.d1bolt .td3{animation-delay:.36s}
@keyframes bDot{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
.d1bolt .scan{animation:bScan 3.2s linear infinite}
@keyframes bScan{0%{transform:translateY(0)}100%{transform:translateY(58px)}}
.d1bolt .shadow{transform-box:view-box;transform-origin:85px 181px;animation:bShadow 3.4s ease-in-out infinite}
.d1bolt.face-cheer .shadow,.d1bolt.face-love .shadow{animation:bShadowHop .3s ease-in-out 6 alternate}
@keyframes bShadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.94)}}
@keyframes bShadowHop{0%{transform:scaleX(1)}100%{transform:scaleX(.72);opacity:.1}}
.d1bolt .cheek{animation:bCheek 3s ease-in-out infinite}
@keyframes bCheek{0%,100%{opacity:.4}50%{opacity:.7}}
.d1bolt .e-love{transform-box:fill-box;transform-origin:center;animation:bBeat .55s ease-in-out infinite}
@keyframes bBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion: reduce){.d1bolt *{animation:none !important}}</style>
